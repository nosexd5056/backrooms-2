<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Backrooms: La Saga Completa</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body, html { width: 100%; height: 100%; overflow: hidden; font-family: 'Courier New', monospace; background: #000; color: #fff; user-select: none; }
    #canvas-container { width: 100vw; height: 100vh; }
    
    #crosshair {
      position: absolute; top: 50%; left: 50%; width: 4px; height: 4px; margin-top: -2px; margin-left: -2px;
      background: rgba(255, 255, 255, 0.6); border-radius: 50%; pointer-events: none; z-index: 10;
    }

    #hud-info {
      position: absolute; top: 20px; left: 20px; font-size: 14px; color: #ef4444; z-index: 10;
      background: rgba(0,0,0,0.85); padding: 8px 14px; border: 1px solid rgba(255, 255, 255, 0.2); border-radius: 4px;
    }

    #geiger-hud {
      position: absolute; top: 60px; left: 20px; font-size: 13px; color: #facc15; z-index: 10;
      background: rgba(0,0,0,0.85); padding: 6px 12px; border-radius: 4px; display: none;
    }

    #interaction-hint {
      position: absolute; bottom: 80px; left: 50%; transform: translateX(-50%);
      font-size: 15px; color: #fde047; z-index: 10; background: rgba(0,0,0,0.85);
      padding: 8px 16px; border-radius: 4px; border: 1px solid #fde047; display: none;
    }

    #static-overlay {
      position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
      background: radial-gradient(circle, rgba(255,0,0,0.2) 0%, rgba(0,0,0,0.9) 100%);
      opacity: 0; pointer-events: none; z-index: 20; transition: opacity 0.1s ease;
    }

    #vhs-overlay {
      position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
      pointer-events: none; z-index: 25; display: none;
      box-shadow: inset 0 0 100px rgba(0,0,0,0.9);
      background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%);
      background-size: 100% 4px;
    }

    #vhs-cam-info {
      position: absolute; top: 25px; right: 30px; color: #22c55e; font-size: 14px; font-weight: bold;
      text-shadow: 0 0 5px #22c55e; display: none; z-index: 30;
    }

    #start-screen {
      position: absolute; top: 0; left: 0; width: 100vw; height: 100vh;
      background: #050505; display: flex; flex-direction: column; justify-content: center; align-items: center;
      z-index: 40; text-align: center; padding: 20px;
    }

    .btn {
      padding: 12px 30px; background: #dc2626; color: #fff; font-size: 16px; font-weight: bold;
      border: none; cursor: pointer; border-radius: 4px; margin-top: 20px;
      box-shadow: 0 0 15px rgba(220, 38, 38, 0.5); transition: 0.2s;
    }
    .btn:hover { background: #b91c1c; transform: scale(1.05); }

    #subtitles {
      position: fixed; bottom: 10%; left: 50%; transform: translateX(-50%);
      background: rgba(0, 0, 0, 0.85); color: #fff; padding: 10px 20px; font-size: 16px;
      border-radius: 4px; display: none; z-index: 30; border: 1px solid rgba(255,255,255,0.2); text-align: center;
    }

    #fade-screen {
      position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
      background: #000; opacity: 0; pointer-events: none; z-index: 50; transition: opacity 1.2s ease;
    }
  </style>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/PointerLockControls.js"></script>
</head>
<body>

<div id="canvas-container"></div>
<div id="crosshair"></div>
<div id="hud-info">CAPÍTULO 1: Hospital Desierto</div>
<div id="geiger-hud">RAD/EMF: 0.02 mSv/h</div>
<div id="interaction-hint">Presiona [E] para interactuar</div>
<div id="static-overlay"></div>
<div id="vhs-overlay"></div>
<div id="vhs-cam-info">REC ● [ASYNC-CORP VISOR 1998]</div>
<div id="subtitles"></div>
<div id="fade-screen"></div>

<div id="start-screen">
  <h1 style="color:#ef4444; font-size: 36px; margin-bottom: 10px;">BACKROOMS: SAGA COMPLETA</h1>
  <p style="color:#a1a1aa; max-width: 520px; line-height: 1.5;">Atraviesa los 6 capítulos: el hospital desierto, el visor del investigador, el laboratorio Async, la carrera roja, la ciudad vacía y la convergencia final.</p>
  <button class="btn" onclick="startGame()">INICIAR SAGA</button>
</div>

<script>
  let scene, camera, renderer, controls, flashlight, ambientLight;
  let moveFwd = false, moveBwd = false, moveLft = false, moveRgt = false;
  let prevTime = performance.now();
  const velocity = new THREE.Vector3(), direction = new THREE.Vector3();

  let chapter = 1;
  let inCinematic = false;
  let interactTarget = null;

  // Objetos dinámicos por capítulo
  let doorNivel6, doorNivel1000, finalPortal, hazmatDoor, geigerTerminal, runTrigger, cityTarget, mirrorObject;
  let invisibleEntityPos = new THREE.Vector3(0, 0, 15);
  let redLightPulse = 0;

  function init() {
    scene = new THREE.Scene();
    camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 100);
    scene.add(camera);

    renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    document.getElementById('canvas-container').appendChild(renderer.domElement);

    controls = new THREE.PointerLockControls(camera, document.body);

    ambientLight = new THREE.AmbientLight(0xffffff, 0.05);
    scene.add(ambientLight);

    flashlight = new THREE.SpotLight(0xffffff, 2.5, 18, Math.PI / 5, 0.4, 1);
    flashlight.position.set(0.2, -0.2, 0);
    camera.add(flashlight);
    flashlight.target.position.set(0, -0.2, -5);
    camera.add(flashlight.target);

    setupControls();
    loadChapter1();

    window.addEventListener('resize', onWindowResize);
    animate();
  }

  function startGame() {
    document.getElementById('start-screen').style.display = 'none';
    controls.lock();
    showSubtitle("¿Hola...? ¿Por qué el hospital está tan vacío?", 3500);
  }

  function setupControls() {
    document.addEventListener('keydown', (e) => {
      if (inCinematic) return;
      if (e.code === 'KeyW') moveFwd = true;
      if (e.code === 'KeyS') moveBwd = true;
      if (e.code === 'KeyA') moveLft = true;
      if (e.code === 'KeyD') moveRgt = true;
      if (e.code === 'KeyE') interact();
    });
    document.addEventListener('keyup', (e) => {
      if (e.code === 'KeyW') moveFwd = false;
      if (e.code === 'KeyS') moveBwd = false;
      if (e.code === 'KeyA') moveLft = false;
      if (e.code === 'KeyD') moveRgt = false;
    });
  }

  function clearScene() {
    while(scene.children.length > 0){ scene.remove(scene.children[0]); }
    scene.add(camera);
    scene.add(ambientLight);
  }

  function transitionTo(nextChapterFunc) {
    inCinematic = true;
    document.getElementById('fade-screen').style.opacity = '1';
    setTimeout(() => {
      nextChapterFunc();
      document.getElementById('fade-screen').style.opacity = '0';
      inCinematic = false;
    }, 1300);
  }

  // --- CAPÍTULO 1: HOSPITAL ---
  function loadChapter1() {
    clearScene(); chapter = 1;
    scene.background = new THREE.Color(0x050508);
    scene.fog = new THREE.FogExp2(0x050508, 0.06);

    document.getElementById('hud-info').textContent = "CAPÍTULO 1: Hospital Desierto";
    document.getElementById('hud-info').style.color = "#ef4444";
    document.getElementById('vhs-overlay').style.display = 'none';
    document.getElementById('vhs-cam-info').style.display = 'none';

    const wallMat = new THREE.MeshStandardMaterial({ color: 0x1e293b });
    const floorMat = new THREE.MeshStandardMaterial({ color: 0x0f172a, roughness: 0.3 });

    const floor = new THREE.Mesh(new THREE.PlaneGeometry(8, 50), floorMat);
    floor.rotation.x = -Math.PI / 2; floor.position.set(0, 0, -15);
    scene.add(floor);

    const wallL = new THREE.Mesh(new THREE.PlaneGeometry(50, 4), wallMat);
    wallL.rotation.y = Math.PI / 2; wallL.position.set(-4, 2, -15);
    scene.add(wallL);

    const wallR = new THREE.Mesh(new THREE.PlaneGeometry(50, 4), wallMat);
    wallR.rotation.y = -Math.PI / 2; wallR.position.set(4, 2, -15);
    scene.add(wallR);

    finalPortal = new THREE.Mesh(new THREE.TorusGeometry(1.2, 0.15, 16, 50), new THREE.MeshBasicMaterial({ color: 0x38bdf8 }));
    finalPortal.position.set(0, 1.6, -35);
    scene.add(finalPortal);

    camera.position.set(0, 1.6, 5);
    camera.rotation.set(0,0,0);
    invisibleEntityPos.set(0, 1.6, 18);
  }

  // --- CAPÍTULO 2: INVESTIGADOR / LOBBY VHS ---
  function loadChapter2() {
    clearScene(); chapter = 2;
    scene.background = new THREE.Color(0x1c1917);
    scene.fog = new THREE.FogExp2(0x1c1917, 0.05);

    document.getElementById('vhs-overlay').style.display = 'block';
    document.getElementById('vhs-cam-info').style.display = 'block';
    document.getElementById('hud-info').textContent = "CAPÍTULO 2: El Visor (Async Corp)";
    document.getElementById('hud-info').style.color = "#22c55e";

    const yellowWall = new THREE.MeshStandardMaterial({ color: 0xd97706, roughness: 0.8 });
    const carpet = new THREE.MeshStandardMaterial({ color: 0x78350f });

    const room = new THREE.Mesh(new THREE.BoxGeometry(16, 4, 30), [
      yellowWall, yellowWall, yellowWall, yellowWall, yellowWall, carpet
    ]);
    room.position.set(0, 2, -10);
    scene.add(room);

    hazmatDoor = new THREE.Mesh(new THREE.BoxGeometry(2, 3, 0.2), new THREE.MeshStandardMaterial({ color: 0x334155 }));
    hazmatDoor.position.set(0, 1.5, -24);
    scene.add(hazmatDoor);

    camera.position.set(0, 1.6, 3);
    camera.rotation.set(0,0,0);
    showSubtitle("Agente Async: Ingrese al sector inferior. Hay alteraciones temporales.", 4000, "#22c55e");
  }

  // --- CAPÍTULO 3: LABORATORIO & GEIGER ---
  function loadChapter3() {
    clearScene(); chapter = 3;
    scene.background = new THREE.Color(0x020617);
    scene.fog = new THREE.FogExp2(0x020617, 0.08);

    document.getElementById('hud-info').textContent = "CAPÍTULO 3: Laboratorio de Brechas";
    document.getElementById('geiger-hud').style.display = 'block';

    const metalMat = new THREE.MeshStandardMaterial({ color: 0x334155, metalness: 0.6, roughness: 0.4 });
    const room = new THREE.Mesh(new THREE.BoxGeometry(20, 5, 20), metalMat);
    room.position.set(0, 2.5, 0);
    scene.add(room);

    geigerTerminal = new THREE.Mesh(new THREE.BoxGeometry(1.2, 2, 1.2), new THREE.MeshBasicMaterial({ color: 0x0284c7 }));
    geigerTerminal.position.set(0, 1, -7);
    scene.add(geigerTerminal);

    camera.position.set(0, 1.6, 7);
    camera.rotation.set(0,0,0);
    showSubtitle("Usa el detector Geiger. Encuentra el servidor de la brecha.", 4000, "#facc15");
  }

  // --- CAPÍTULO 4: NIVEL ¡CORRE! ---
  function loadChapter4() {
    clearScene(); chapter = 4;
    document.getElementById('geiger-hud').style.display = 'none';
    scene.background = new THREE.Color(0x450a0a);
    scene.fog = new THREE.FogExp2(0x450a0a, 0.03);

    document.getElementById('hud-info').textContent = "CAPÍTULO 4: ¡CORRE! (Level !)";
    document.getElementById('hud-info').style.color = "#dc2626";

    const redCorridor = new THREE.Mesh(new THREE.BoxGeometry(6, 4, 80), new THREE.MeshStandardMaterial({ color: 0x991b1b }));
    redCorridor.position.set(0, 2, -35);
    scene.add(redCorridor);

    runTrigger = new THREE.Mesh(new THREE.BoxGeometry(6, 4, 1), new THREE.MeshBasicMaterial({ color: 0xef4444, transparent: true, opacity: 0.3 }));
    runTrigger.position.set(0, 2, -70);
    scene.add(runTrigger);

    camera.position.set(0, 1.6, 2);
    camera.rotation.set(0,0,0);
    showSubtitle("¡ALARMA DE CONTENCIÓN! ¡CORRE HACIA EL FONDO!", 4000, "#ef4444");
  }

  // --- CAPÍTULO 5: LA CIUDAD DESIERTA ---
  function loadChapter5() {
    clearScene(); chapter = 5;
    scene.background = new THREE.Color(0x030712);
    scene.fog = new THREE.FogExp2(0x030712, 0.02);

    document.getElementById('hud-info').textContent = "CAPÍTULO 5: La Ciudad Vacía (Nivel 11)";
    document.getElementById('hud-info').style.color = "#38bdf8";

    // Suelo de asfalto extenso
    const ground = new THREE.Mesh(new THREE.PlaneGeometry(120, 120), new THREE.MeshStandardMaterial({ color: 0x111827 }));
    ground.rotation.x = -Math.PI / 2;
    scene.add(ground);

    // Edificios oscuros
    for(let i=0; i<25; i++) {
      const b = new THREE.Mesh(new THREE.BoxGeometry(8 + Math.random()*6, 15 + Math.random()*20, 8 + Math.random()*6), new THREE.MeshStandardMaterial({ color: 0x1f2937 }));
      b.position.set((Math.random()-0.5)*90, b.geometry.parameters.height/2, (Math.random()-0.5)*90);
      scene.add(b);
    }

    cityTarget = new THREE.Mesh(new THREE.CylinderGeometry(1, 1, 10, 16), new THREE.MeshBasicMaterial({ color: 0xf59e0b }));
    cityTarget.position.set(0, 5, -40);
    scene.add(cityTarget);

    camera.position.set(0, 1.6, 30);
    camera.rotation.set(0,0,0);
    showSubtitle("Una metrópolis sin alma... Busca la torre de transmisión de luz.", 4500, "#38bdf8");
  }

  // --- CAPÍTULO 6: LA CONVERGENCIA ---
  function loadChapter6() {
    clearScene(); chapter = 6;
    scene.background = new THREE.Color(0x000000);
    scene.fog = new THREE.FogExp2(0x000000, 0.05);

    document.getElementById('hud-info').textContent = "CAPÍTULO 6: La Convergencia (Bucle)";
    document.getElementById('hud-info').style.color = "#f43f5e";

    const roomMat = new THREE.MeshStandardMaterial({ color: 0x27272a, metalness: 0.8, roughness: 0.2 });
    const mirrorRoom = new THREE.Mesh(new THREE.BoxGeometry(10, 4, 10), roomMat);
    mirrorRoom.position.set(0, 2, 0);
    scene.add(mirrorRoom);

    mirrorObject = new THREE.Mesh(new THREE.PlaneGeometry(3, 3), new THREE.MeshBasicMaterial({ color: 0xffffff, side: THREE.DoubleSide }));
    mirrorObject.position.set(0, 1.8, -4.8);
    scene.add(mirrorObject);

    camera.position.set(0, 1.6, 3);
    camera.rotation.set(0,0,0);
    showSubtitle("Investigador y Paciente... siempre fueron la misma persona atrapada en la grabación.", 6000, "#f43f5e");
  }

  // --- INTERACCIONES ---
  function interact() {
    if (chapter === 2 && camera.position.distanceTo(hazmatDoor.position) < 3.5) {
      transitionTo(loadChapter3);
    } else if (chapter === 3 && camera.position.distanceTo(geigerTerminal.position) < 3.5) {
      transitionTo(loadChapter4);
    } else if (chapter === 6 && camera.position.distanceTo(mirrorObject.position) < 3.0) {
      showSubtitle("FIN DE LA SAGA. Has cerrado el bucle.", 10000, "#22c55e");
    }
  }

  function showSubtitle(text, duration = 3000, color = "#fff") {
    const sub = document.getElementById('subtitles');
    sub.style.display = 'block'; sub.style.color = color; sub.textContent = text;
    setTimeout(() => { sub.style.display = 'none'; }, duration);
  }

  function animate() {
    requestAnimationFrame(animate);

    const time = performance.now();
    const delta = (time - prevTime) / 1000;

    if (controls.isLocked && !inCinematic) {
      let speedMult = (chapter === 4) ? 38.0 : 20.0; // Correr más rápido en Nivel !

      velocity.x -= velocity.x * 10.0 * delta;
      velocity.z -= velocity.z * 10.0 * delta;

      direction.z = Number(moveFwd) - Number(moveBwd);
      direction.x = Number(moveRgt) - Number(moveLft);
      direction.normalize();

      if (moveFwd || moveBwd) velocity.z -= direction.z * speedMult * delta;
      if (moveLft || moveRgt) velocity.x -= direction.x * speedMult * delta;

      controls.moveRight(-velocity.x * delta);
      controls.moveForward(-velocity.z * delta);

      // Lógica específica por capítulo
      if (chapter === 1) {
        invisibleEntityPos.z -= 1.2 * delta;
        const dist = camera.position.distanceTo(invisibleEntityPos);
        document.getElementById('static-overlay').style.opacity = dist < 10 ? (1 - (dist / 10)).toFixed(2) : '0';

        if (camera.position.distanceTo(finalPortal.position) < 2.0) {
          transitionTo(loadChapter2);
        }
      } 
      else if (chapter === 2) {
        const near = camera.position.distanceTo(hazmatDoor.position) < 3.5;
        document.getElementById('interaction-hint').style.display = near ? 'block' : 'none';
      }
      else if (chapter === 3) {
        const distToTerm = camera.position.distanceTo(geigerTerminal.position);
        const radValue = (0.02 + (10 / (distToTerm + 0.1))).toFixed(2);
        document.getElementById('geiger-hud').textContent = `RAD/EMF: ${radValue} mSv/h`;
        document.getElementById('interaction-hint').style.display = distToTerm < 3.5 ? 'block' : 'none';
      }
      else if (chapter === 4) {
        redLightPulse += delta * 8;
        flashlight.color.setHSL(0, 1, 0.2 + Math.sin(redLightPulse)*0.2);

        if (camera.position.distanceTo(runTrigger.position) < 3.0) {
          flashlight.color.setHex(0xffffff);
          transitionTo(loadChapter5);
        }
      }
      else if (chapter === 5) {
        if (camera.position.distanceTo(cityTarget.position) < 4.0) {
          transitionTo(loadChapter6);
        }
      }
      else if (chapter === 6) {
        const nearMirror = camera.position.distanceTo(mirrorObject.position) < 3.0;
        document.getElementById('interaction-hint').style.display = nearMirror ? 'block' : 'none';
      }
    }

    prevTime = time;
    renderer.render(scene, camera);
  }

  function onWindowResize() {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
  }

  window.onload = init;
</script>
</body>
</html>
